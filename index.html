<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Café — registro de extração</title>
<meta name="theme-color" content="#100E0C">
<meta name="description" content="Registro de extração de café com sugestão de moagem em cliques para moedor manual.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Café">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --ink:#100E0C; --panel:#191512; --panel2:#221D18; --line:#332B24;
  --text:#F2EADD; --dim:#8E8375;
  --teal:#3FB8A0; --amber:#F2A413; --blue:#7FB2E5; --violet:#C793E0; --red:#D4553C;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --shell: 560px;   /* largura útil: cabeçalho, abas e conteúdo alinhados */
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--ink); color:var(--text); font-family:var(--sans);
  -webkit-text-size-adjust:100%;}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:var(--sans); font-size:16px;}

header.top{padding:calc(22px + env(safe-area-inset-top)) 18px 14px; border-bottom:1px solid var(--line);}
header.top .inner{max-width:var(--shell); margin:0 auto; gap:16px;
  display:flex; justify-content:space-between; align-items:flex-end;}
.brand{font:700 22px var(--mono); letter-spacing:.24em;}
.sub{font-size:12px; color:var(--dim); margin-top:4px;}
.count{font:700 20px var(--mono); color:var(--dim); text-align:right;}

main{padding:16px; max-width:var(--shell); margin:0 auto; display:grid; gap:14px;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
.panel.flush{padding:0; overflow:hidden;}
.eyebrow{font:600 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--dim);}
.row{display:flex; gap:12px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field{display:block; margin-bottom:12px;}
.field > .lab{font:600 10px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:7px;}
.hint{font-size:11px; line-height:1.4; color:var(--dim); margin-top:5px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:9px; padding:11px 12px; outline:none; appearance:none;}
textarea{resize:vertical;}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

.btn{border:1px solid var(--line); background:transparent; color:var(--text);
  font:600 13px/1 var(--sans); padding:12px 16px; border-radius:10px;}
.btn.solid{color:var(--ink); border-color:transparent;}
.btn.quiet{border-color:transparent; color:var(--dim);}
.btn[disabled]{opacity:.4;}
.btn.wide{width:100%;}

.seg{display:flex; flex-wrap:wrap; gap:6px; background:var(--panel2); border:1px solid var(--line);
  border-radius:11px; padding:4px;}
.seg button{flex:1 1 40%; min-width:70px; padding:10px 6px; border:none; border-radius:8px;
  background:transparent; color:var(--dim); font:600 12px var(--sans);}
.seg button.on{color:var(--ink);}

.dialwrap svg{width:100%; max-width:340px; margin:0 auto; display:block;}
.dialrow{display:flex; align-items:center; gap:10px; margin-top:-8px;}
.dialrow .btn{width:46px; padding:12px 0; font:700 18px var(--mono); text-align:center;}
.dialnote{flex:1; text-align:center; font-size:12px; color:var(--dim);}
.zero{font-size:11px; line-height:1.5; color:var(--dim); margin-top:8px; text-align:center;}
.why{margin-top:16px; padding:12px; background:var(--panel2); border:1px solid var(--line); border-radius:10px;}
.why p{margin:0; font-size:12px; line-height:1.55; color:var(--dim);}
.why p:first-child{color:var(--text);}
.why p + p{margin-top:5px;}

.big{font:700 24px var(--mono); margin-top:4px;}
.clock{font:700 44px var(--mono); letter-spacing:-.04em;}
.stages{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.stage{display:flex; gap:12px; padding:10px 12px; background:var(--panel);}
.stage.on{background:var(--panel2);}
.stage .t{font:600 12px var(--mono); color:var(--dim); width:42px;}
.stage .l{font:600 13px var(--sans); color:var(--dim);}
.stage .d{font-size:12px; color:var(--dim); margin-top:2px;}
.stage.on .t{color:var(--acc);} .stage.on .l{color:var(--text);}

.rate{display:flex; gap:8px;}
.rate button{flex:1; height:46px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--dim); font:700 15px var(--mono);}
.tags{display:flex; flex-wrap:wrap; gap:7px;}
.tags button{padding:8px 12px; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--dim); font:600 12px var(--sans);}

.entry{padding:16px; border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.entry .meta{font:500 12px var(--mono); color:var(--dim); margin-top:6px; line-height:1.5;}
.chip{font:600 11px var(--sans); padding:4px 9px; border-radius:999px; border:1px solid var(--line);}
.note{font-size:12px; line-height:1.5; color:var(--dim); margin-top:8px;}

nav.tabs{position:fixed; left:0; right:0; bottom:0;
  background:rgba(16,14,12,.94); border-top:1px solid var(--line);
  backdrop-filter:blur(8px); padding:8px 8px calc(14px + env(safe-area-inset-bottom));}
nav.tabs .inner{max-width:var(--shell); margin:0 auto; display:flex;}
nav.tabs button{flex:1; background:none; border:none; border-top:2px solid transparent;
  padding:10px 0; color:var(--dim); font:600 11px var(--mono); letter-spacing:.16em; text-transform:uppercase;}
nav.tabs button.on{color:var(--text); border-top-color:var(--teal);}

.flash{margin:12px auto 0; max-width:var(--shell); width:calc(100% - 32px);
  padding:10px 12px; border-radius:10px;
  background:var(--panel2); border:1px solid var(--line); font:500 12px var(--sans);}
.empty{text-align:center; padding:32px;}
.empty h2{font:600 16px var(--sans); margin:0 0 8px;}
.empty p{font-size:13px; line-height:1.6; color:var(--dim); margin:0 0 20px;}
.legend{display:flex; gap:16px; margin-top:8px; font:500 11px var(--mono); color:var(--dim);}
.linkbtn{background:none; border:none; color:var(--dim); font:500 12px var(--sans); padding:0;}

.thumb{width:56px; height:56px; flex:0 0 auto; border-radius:10px; object-fit:cover;
  border:1px solid var(--line); background:var(--panel2); display:block; padding:0;}
.thumb.empty{color:var(--dim); font:400 22px var(--mono); border-style:dashed;}
.photoprev{display:block; width:100%; max-height:240px; object-fit:cover;
  border-radius:10px; border:1px solid var(--line); background:var(--panel2);}

.topright{display:flex; align-items:flex-end; gap:12px;}
.iconbtn{background:transparent; border:1px solid var(--line); color:var(--dim);
  width:40px; height:40px; border-radius:10px; padding:0; display:grid; place-items:center;}
.iconbtn svg{width:20px; height:20px; display:block;}

#drawer{position:fixed; inset:0; z-index:50; visibility:hidden;}
#drawer.open{visibility:visible;}
#drawer .scrim{position:absolute; inset:0; background:rgba(8,7,6,.62);
  opacity:0; transition:opacity .22s ease;}
#drawer.open .scrim{opacity:1;}
#drawer aside{position:absolute; top:0; right:0; bottom:0; width:min(86vw,360px);
  background:var(--panel); border-left:1px solid var(--line);
  transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column;}
#drawer.open aside{transform:none;}
.dwhead{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:calc(18px + env(safe-area-inset-top)) 16px 14px; border-bottom:1px solid var(--line);}
.dwtitle{font:700 13px var(--mono); letter-spacing:.2em; text-transform:uppercase;}
.dwbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom));
  display:grid; gap:22px; align-content:start;}
.sect > .eyebrow{display:block; margin-bottom:9px;}
.sect .btn.wide + .btn.wide{margin-top:8px;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper .btn{width:46px; padding:12px 0; font:700 18px var(--mono); text-align:center;}
.stepper .val{flex:1; text-align:center; font:700 22px var(--mono);}
.kv{display:grid; gap:7px; font:500 12px var(--mono); color:var(--dim);}
.kv div{display:flex; justify-content:space-between; gap:12px;}
.kv span:last-child{color:var(--text);}
.btn.danger{color:var(--red); border-color:rgba(212,85,60,.45);}

/* telas largas: a barra de abas sai de baixo do polegar e vira navegação de
   topo. body vira flex só para reordenar — no HTML as abas vêm depois do main */
@media (min-width:820px){
  body{display:flex; flex-direction:column; padding-bottom:40px;}
  header.top{order:0;}
  nav.tabs{order:1; position:static; padding:0 18px;
    background:transparent; backdrop-filter:none;
    border-top:none; border-bottom:1px solid var(--line);}
  #flash{order:2;}
  main{order:3; width:100%;}
  nav.tabs button{flex:0 0 auto; padding:15px 24px 13px;
    border-top:none; border-bottom:2px solid transparent;}
  nav.tabs button.on{border-bottom-color:var(--teal);}
}

/* telas curtas e baixas (celular deitado): o mostrador come a tela toda */
@media (max-height:520px){
  .dialwrap svg{max-width:240px;}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<header class="top">
 <div class="inner">
  <div>
    <div class="brand">MEU CAFÉ</div>
    <div class="sub">Registro de extração · moedor manual</div>
  </div>
  <div class="topright">
    <div>
      <div class="count" id="cnt">0</div>
      <div class="eyebrow">extrações</div>
    </div>
    <button class="iconbtn" id="gearBtn" data-a="setOpen" aria-label="Configurações" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

 </div>
</header>
<div id="flash"></div>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>

<div id="drawer" aria-hidden="true">
  <div class="scrim" data-a="setClose"></div>
  <aside role="dialog" aria-modal="true" aria-label="Configurações">
    <div class="dwhead">
      <div class="dwtitle">Configurações</div>
      <button class="iconbtn" id="dwClose" data-a="setClose" aria-label="Fechar configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="dwbody" id="dwbody"></div>
  </aside>
</div>

<script>
"use strict";

/* ----------------------------------------------------------- constantes */
const KEY = "bancada-cafe-v2";
const DEFAULTS = { cpt:12 };   // cliques por volta do moedor (padrão iCoffee M3 Pro)
const CPT_MIN = 4, CPT_MAX = 60;
/* foto do pacote: o localStorage tem teto de ~5 MB e uma foto de celular crua
   passa de 3 MB. Reduzida assim cada uma fica na casa dos 60 KB. */
const PHOTO_MAX = 640, PHOTO_Q = 0.72;
const DIAL_MAX = 36;

const METHODS = {
  v60:      {id:"v60",      label:"V60",             short:"V60",      acc:"var(--teal)",   unit:"Água",       baseClicks:20, min:16, max:24, baseOutput:240, baseRatio:16, target:[150,180]},
  coado:    {id:"coado",    label:"Café passado",    short:"Passado",  acc:"var(--blue)",   unit:"Água",       baseClicks:22, min:18, max:26, baseOutput:480, baseRatio:12, target:[180,240]},
  prensa:   {id:"prensa",   label:"Prensa francesa", short:"Prensa",   acc:"var(--violet)", unit:"Água",       baseClicks:27, min:24, max:30, baseOutput:450, baseRatio:15, target:[240,260]},
  espresso: {id:"espresso", label:"Espresso 15 bar", short:"Espresso", acc:"var(--amber)",  unit:"Na xícara",  baseClicks:8,  min:6,  max:10, baseOutput:36,  baseRatio:2,  target:[25,30]}
};
const ROASTS = [{id:"clara",label:"Clara",adj:-1},{id:"media",label:"Média",adj:0},{id:"escura",label:"Escura",adj:1}];
const TAGS = [
  {id:"doce",label:"Doce",dir:"ok"},{id:"frutado",label:"Frutado",dir:"ok"},
  {id:"floral",label:"Floral",dir:"ok"},{id:"caramelo",label:"Caramelo",dir:"ok"},
  {id:"chocolate",label:"Achocolatado",dir:"ok"},{id:"encorpado",label:"Encorpado",dir:"ok"},
  {id:"limpo",label:"Limpo",dir:"ok"},
  {id:"amargo",label:"Amargo",dir:"coarser"},{id:"adstringente",label:"Adstringente",dir:"coarser"},
  {id:"queimado",label:"Queimado",dir:"coarser"},{id:"seco",label:"Seco no final",dir:"coarser"},
  {id:"azedo",label:"Azedo",dir:"finer"},{id:"aguado",label:"Aguado",dir:"finer"},
  {id:"fraco",label:"Fraco",dir:"finer"},{id:"salgado",label:"Salgado",dir:"finer"}
];
const TAGMAP = Object.fromEntries(TAGS.map(t=>[t.id,t]));
const tagColor = d => d==="ok" ? "var(--teal)" : d==="coarser" ? "var(--red)" : "var(--amber)";

/* ------------------------------------------------------------ utilidades */
const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const r1 = n => Math.round(n*10)/10;
const num = (v,f=0) => (v===""||v===null||v===undefined||isNaN(v)) ? f : Number(v);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function mmss(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+String(r).padStart(2,"0"); }
function turns(c){
  const cpt=S.settings.cpt, t=Math.floor(c/cpt), r=c%cpt;
  if(!t) return r+" cliques a partir do zero";
  return t+" volta"+(t>1?"s":"")+" + "+r+" clique"+(r===1?"":"s");
}
function fmtDate(iso){ return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); }
function daysSince(d){ if(!d) return null; return Math.floor((Date.now()-new Date(d+"T12:00:00").getTime())/86400000); }
function beanLabel(b){ return !b ? "—" : (b.name ? b.brand+" · "+b.name : b.brand); }
function tempFor(r){ return r==="clara" ? 94 : r==="escura" ? 89 : 92; }

/* só data URL de imagem entra num src — backup importado é arquivo de fora */
function safePhoto(p){ return (typeof p==="string" && /^data:image\//.test(p)) ? p : ""; }
function fmtBytes(n){
  return n<1024 ? n+" B" : n<1048576 ? Math.round(n/1024)+" KB" : (n/1048576).toFixed(1)+" MB";
}
function usedBytes(){
  try{ return new Blob([localStorage.getItem(KEY)||""]).size; }catch(e){ return 0; }
}

/* reduz a foto antes de guardar. createImageBitmap resolve a orientação do
   EXIF, que é o que deixa foto de iPhone deitada; o <img> é o plano B */
async function shrinkImage(file){
  let src, w, h;
  if(self.createImageBitmap){
    src = await createImageBitmap(file, {imageOrientation:"from-image"});
    w = src.width; h = src.height;
  }else{
    const url = URL.createObjectURL(file);
    try{
      src = await new Promise((res,rej)=>{
        const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=url;
      });
    } finally { setTimeout(()=>URL.revokeObjectURL(url),0); }
    w = src.naturalWidth; h = src.naturalHeight;
  }
  if(!w || !h) throw new Error("vazia");
  const s = Math.min(1, PHOTO_MAX/Math.max(w,h));
  const cw = Math.max(1,Math.round(w*s)), ch = Math.max(1,Math.round(h*s));
  const c = document.createElement("canvas"); c.width=cw; c.height=ch;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cw,ch);   // PNG com transparência sairia preto
  ctx.drawImage(src,0,0,cw,ch);
  if(src.close) src.close();
  return c.toDataURL("image/jpeg", PHOTO_Q);
}

/* --------------------------------------------------------------- estado */
const S = {
  tab:"brew", beans:[], brews:[],
  methodId:"v60", beanId:null,
  clicks:20, output:240, dose:15, ratio:16,
  seconds:0, running:false, t0:0, tick:null,
  logging:false, rating:0, tags:[], note:"",
  form:{brand:"",name:"",roast:"media",process:"",roastDate:"",photo:"",open:false},
  fMethod:"todos", fBean:"todos",
  settings:Object.assign({}, DEFAULTS), settingsOpen:false,
  photoTarget:null   // id do café recebendo foto pela lista
};
const emptyForm = () => ({brand:"",name:"",roast:"media",process:"",roastDate:"",photo:"",open:false});

/* aceita só o que for válido — backup antigo não tem settings, e arquivo
   editado à mão não pode zerar o CPT e quebrar a divisão em voltas */
function applySettings(o){
  if(!o) return;
  const c = Math.round(Number(o.cpt));
  if(Number.isFinite(c)) S.settings.cpt = clamp(c, CPT_MIN, CPT_MAX);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); S.beans=d.beans||[]; S.brews=d.brews||[]; applySettings(d.settings); }
  }catch(e){}
  if(S.beans.length) S.beanId = S.beans[0].id;
  S.form.open = !S.beans.length;
}
/* devolve false quando o navegador recusa (cota estourada), para quem chamou
   poder desfazer em vez de deixar a tela mostrando algo que não foi salvo */
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({beans:S.beans, brews:S.brews, settings:S.settings}));
    return true;
  }catch(e){
    flash("Não consegui salvar neste navegador. Exporte um backup em Configurações.");
    return false;
  }
}
function flash(msg){
  $("#flash").innerHTML = '<div class="flash">'+esc(msg)+'</div>';
  setTimeout(()=>{ $("#flash").innerHTML=""; }, 3800);
}

/* ---------------------------------------------------------- a sugestão */
function feedbackDelta(b, m){
  const tg = b.tags||[];
  const coarse = tg.filter(t=>TAGMAP[t] && TAGMAP[t].dir==="coarser").length;
  const fine   = tg.filter(t=>TAGMAP[t] && TAGMAP[t].dir==="finer").length;
  if(coarse>fine) return {d:1, why:"A última saiu sobre-extraída (amarga/adstringente)."};
  if(fine>coarse) return {d:-1, why:"A última saiu sub-extraída (azeda/aguada)."};
  const lo=m.target[0], hi=m.target[1];
  if(b.timeS){
    if(b.timeS > hi*1.25) return {d:1, why:"A última levou "+mmss(b.timeS)+", acima do alvo."};
    if(b.timeS < lo*0.8)  return {d:-1, why:"A última levou "+mmss(b.timeS)+", abaixo do alvo."};
  }
  if(b.rating<=2) return {d:1, why:"Nota baixa sem pista de sabor: abrindo um pouco a moagem para testar."};
  return {d:0, why:null};
}

function suggest(bean, methodId){
  const m = METHODS[methodId];
  const hist = S.brews.filter(b=>bean && b.beanId===bean.id && b.method===methodId)
                      .sort((a,b)=> new Date(a.date)-new Date(b.date));
  let clicks=m.baseClicks, output=m.baseOutput, ratio=m.baseRatio, dose=r1(m.baseOutput/m.baseRatio);
  const why=[];
  const roast = ROASTS.find(r=>r.id===(bean&&bean.roast));
  if(roast && roast.adj){
    clicks += roast.adj;
    why.push(roast.adj<0 ? "Torra clara: 1 clique mais fino que o padrão."
                         : "Torra escura: 1 clique mais grosso que o padrão.");
  }
  if(!hist.length){
    why.unshift("Primeira extração deste café no método "+m.short+". Ponto de partida da faixa do moedor.");
    return {clicks:clamp(clicks,1,DIAL_MAX), output, dose, ratio, why};
  }
  const best = hist.filter(b=>b.rating>=4)
                   .sort((a,b)=> b.rating-a.rating || new Date(b.date)-new Date(a.date))[0];
  const last = hist[hist.length-1];
  why.length = 0;
  if(best){
    clicks=best.clicks; output=best.outputG; dose=best.doseG; ratio=best.ratio||ratio;
    why.push("Repetindo sua melhor extração deste café (nota "+best.rating+", "+fmtDate(best.date)+").");
    if(last.id!==best.id && last.rating<best.rating)
      why.push("A última ficou pior que essa, então voltamos para a receita que funcionou.");
  }else{
    clicks=last.clicks; output=last.outputG; dose=last.doseG; ratio=last.ratio||ratio;
    const fb = feedbackDelta(last,m);
    clicks += fb.d;
    why.push("Partindo da última ("+last.clicks+" cliques, nota "+last.rating+").");
    why.push(fb.why ? fb.why+" "+(fb.d>0?"+":"")+fb.d+" clique."
                    : "Sem sinal claro de sabor: mantendo a moagem e variando só a água se quiser.");
  }
  return {clicks:clamp(Math.round(clicks),1,DIAL_MAX), output, dose, ratio, why};
}

function stagesFor(methodId, output, dose){
  const m = METHODS[methodId], o = Math.round(output), bloom = Math.round(dose*2);
  if(methodId==="espresso") return [
    {t:0,  l:"Trave o portafiltro e ligue", d:"Alvo: "+o+" g na xícara"},
    {t:8,  l:"Primeiras gotas",             d:"Devem aparecer entre 6 s e 10 s"},
    {t:m.target[0], l:"Janela de corte",    d:"Corte entre "+m.target[0]+" s e "+m.target[1]+" s"}
  ];
  if(methodId==="prensa") return [
    {t:0,  l:"Despeje toda a água", d:o+" g de uma vez, mexa levemente"},
    {t:30, l:"Tampe",               d:"Êmbolo levantado, não mexa mais"},
    {t:m.target[0], l:"Pressione o êmbolo", d:"Lento e constante, 15–20 s"}
  ];
  if(methodId==="coado") return [
    {t:0,  l:"Pré-infusão", d:bloom+" g de água, espere hidratar"},
    {t:30, l:"2º despejo",  d:"Complete até "+Math.round(o*0.6)+" g"},
    {t:70, l:"3º despejo",  d:"Complete até "+o+" g"},
    {t:m.target[0], l:"Fim da coagem", d:"O leito deve terminar de escoar por aqui"}
  ];
  return [
    {t:0,  l:"Bloom",      d:bloom+" g de água, saturar tudo"},
    {t:45, l:"2º despejo", d:"Suba até "+Math.round(o*0.6)+" g em espiral"},
    {t:90, l:"3º despejo", d:"Complete até "+o+" g"},
    {t:150,l:"Drawdown",   d:"Alvo de leito seco entre 2:30 e 3:00"}
  ];
}

/* ------------------------------------------------------- o dial (SVG) */
function dialSVG(clicks, acc, band){
  const cx=130, cy=122, r=96, a0=135, sweep=270;
  const ang = v => ((a0 + (clamp(v,0,DIAL_MAX)/DIAL_MAX)*sweep) * Math.PI)/180;
  const pt  = (v,rad) => [cx+rad*Math.cos(ang(v)), cy+rad*Math.sin(ang(v))];
  const arc = (f,t,rad) => { const a=pt(f,rad), b=pt(t,rad);
    const big = ((t-f)/DIAL_MAX)*sweep > 180 ? 1 : 0;
    return "M "+a[0]+" "+a[1]+" A "+rad+" "+rad+" 0 "+big+" 1 "+b[0]+" "+b[1]; };
  let ticks="";
  for(let i=0;i<=DIAL_MAX;i++){
    const maj = i%S.settings.cpt===0, a=pt(i, r-(maj?15:8)), b=pt(i,r);
    ticks += '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(maj?"var(--text)":"var(--line)")+'" stroke-width="'+(maj?2:1)+'" stroke-linecap="round"/>';
  }
  let labels="";
  /* uma marca por volta, mas rareia quando o moedor tem poucos cliques por
     volta — senão o mostrador vira uma fileira de rótulos grudados */
  const cpt = S.settings.cpt;
  const step = cpt * Math.max(1, Math.ceil((DIAL_MAX/cpt)/4));
  for(let v=0; v<=DIAL_MAX; v+=step){ const p=pt(v,r-30);
    labels += '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" fill="var(--dim)" style="font:600 10px var(--mono)">'+(v?(v/cpt)+"v":"0")+'</text>'; }
  const n=pt(clicks,r-4), i0=pt(clicks,34);
  return '<svg viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="'+arc(0,DIAL_MAX,r)+'" fill="none" stroke="var(--line)" stroke-width="1"/>'
    + '<path d="'+arc(band[0],band[1],r-22)+'" fill="none" stroke="'+acc+'" stroke-width="3" stroke-opacity=".32" stroke-linecap="round"/>'
    + ticks + labels
    + '<line x1="'+i0[0]+'" y1="'+i0[1]+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="'+acc+'" stroke-width="2.5" stroke-linecap="round"/>'
    + '<circle cx="'+n[0]+'" cy="'+n[1]+'" r="6.5" fill="'+acc+'"/>'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--line)"/>'
    + '<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" fill="var(--text)" style="font:700 54px var(--mono); letter-spacing:-.03em">'+clicks+'</text>'
    + '<text x="'+cx+'" y="'+(cy+8)+'" text-anchor="middle" fill="var(--dim)" style="font:600 10px var(--mono); letter-spacing:.2em">CLIQUES</text>'
    + '</svg>';
}

/* ----------------------------------------------------- gráficos (SVG) */
function lineChart(rows){
  const W=320,H=210, L=24,R=26,T=10,B=26;
  if(!rows.length) return "";
  const iw=W-L-R, ih=H-T-B;
  const xs = i => rows.length===1 ? L+iw/2 : L + i*(iw/(rows.length-1));
  const yN = v => T + ih - (v/5)*ih;
  const yC = v => T + ih - (clamp(v,0,DIAL_MAX)/DIAL_MAX)*ih;
  let g="";
  for(let v=0;v<=5;v++){
    const y=yN(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="2 4"/>'
       + '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--dim)" style="font:500 10px var(--mono)">'+v+'</text>';
  }
  [0,12,24,36].forEach(v=>{ const y=yC(v);
    g += '<text x="'+(W-R+6)+'" y="'+(y+4)+'" fill="var(--dim)" style="font:500 10px var(--mono)">'+v+'</text>'; });
  const pN = rows.map((r,i)=> xs(i)+","+yN(r.nota)).join(" ");
  const pC = rows.map((r,i)=> xs(i)+","+yC(r.cliques)).join(" ");
  let dots = rows.map((r,i)=> '<circle cx="'+xs(i)+'" cy="'+yN(r.nota)+'" r="3.2" fill="var(--teal)"/>').join("");
  let xl="";
  const marks = rows.length<=4 ? rows.map((_,i)=>i) : [0, Math.floor((rows.length-1)/2), rows.length-1];
  marks.forEach(i=>{ xl += '<text x="'+xs(i)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--dim)" style="font:500 10px var(--mono)">'+rows[i].label+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%" xmlns="http://www.w3.org/2000/svg">'+g
    + '<polyline points="'+pC+'" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 3"/>'
    + '<polyline points="'+pN+'" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/>'
    + dots + xl + '</svg>';
}

function scatterChart(rows){
  const W=320,H=200, L=24,R=12,T=10,B=26;
  const iw=W-L-R, ih=H-T-B;
  const xs = v => L + (clamp(v,0,DIAL_MAX)/DIAL_MAX)*iw;
  const ys = v => T + ih - (v/5)*ih;
  let g="";
  for(let v=0;v<=5;v++){ const y=ys(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="2 4"/>'
       + '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--dim)" style="font:500 10px var(--mono)">'+v+'</text>'; }
  [0,12,24,36].forEach(v=>{ g += '<text x="'+xs(v)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--dim)" style="font:500 10px var(--mono)">'+v+'</text>'; });
  const pts = rows.map(r=> '<circle cx="'+xs(r.x)+'" cy="'+ys(r.y)+'" r="5" fill="'+r.c+'" fill-opacity=".85"/>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%" xmlns="http://www.w3.org/2000/svg">'+g+pts+'</svg>';
}

          + '<div class="meta">'+fmtDate(b.date)+' · '+mm.short+' · '+b.clicks+' cliques · '+b.doseG+' g café · '
          + b.outputG+' g '+(b.method==="espresso"?"na xícara":"água")
          + (b.timeS?' · '+mmss(b.timeS):'')+' · 1:'+b.ratio+'</div>'
          + (tg?'<div class="tags" style="margin-top:8px">'+tg+'</div>':'')
          + (b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'</div>';
      }).join("")+'</div>';

  const backup = '<div class="panel"><div class="eyebrow">Backup</div>'
    + '<p class="hint" style="margin:8px 0 12px">Os dados ficam só neste navegador. Exportar e importar agora fica em Configurações.</p>'
    + '<button class="btn wide" data-a="setOpen">Abrir configurações</button></div>';

  return filters + charts + diary + backup;
}

/* ------------------------------------------------- gaveta de config */
function viewSettings(){
  const s = S.settings;
  const moedor = '<div class="sect"><div class="eyebrow">Moedor</div>'
    + '<p class="hint" style="margin:0 0 12px">Quantos cliques o seu moedor dá em uma volta completa. Muda só a leitura da sugestão em voltas — o número de cliques continua o mesmo.</p>'
    + '<div class="stepper">'
      + '<button class="btn" data-a="cpt:-1" aria-label="Um clique a menos por volta">−</button>'
      + '<div class="val" id="cptVal">'+s.cpt+'</div>'
      + '<button class="btn" data-a="cpt:1" aria-label="Um clique a mais por volta">+</button></div>'
    + '<p class="hint" style="text-align:center">cliques por volta · padrão 12 (iCoffee M3 Pro)</p></div>';

  const backup = '<div class="sect"><div class="eyebrow">Backup</div>'
    + '<p class="hint" style="margin:0 0 12px">Seus registros ficam só neste navegador, neste aparelho. Exporte de vez em quando — é o que salva seus cafés se você trocar de celular ou limpar os dados do site.</p>'
    + '<button class="btn wide" data-a="export">Exportar JSON</button>'
    + '<button class="btn wide" data-a="import">Importar backup</button>'
    + '<input type="file" id="fileIn" accept="application/json,.json" style="display:none">'
    + '<p class="hint">Importar mescla com o que já está aqui, não sobrescreve.</p></div>';

  const ultima = S.brews.length ? fmtDate(S.brews[0].date) : "—";
  const fotos = S.beans.filter(b=>safePhoto(b.photo)).length;
  const neste = '<div class="sect"><div class="eyebrow">Neste aparelho</div>'
    + '<div class="kv">'
      + '<div><span>cafés</span><span>'+S.beans.length+'</span></div>'
      + '<div><span>extrações</span><span>'+S.brews.length+'</span></div>'
      + '<div><span>fotos</span><span>'+fotos+'</span></div>'
      + '<div><span>última</span><span>'+ultima+'</span></div>'
      + '<div><span>espaço usado</span><span>'+fmtBytes(usedBytes())+'</span></div>'
    + '</div>'
    + '<p class="hint">O navegador reserva por volta de 5 MB. Fotos são o que ocupa espaço — cada uma fica em torno de 60 KB.</p></div>';

  const risco = '<div class="sect"><div class="eyebrow">Zona de risco</div>'
    + '<p class="hint" style="margin:0 0 12px">Apaga todos os cafés e extrações deste aparelho. Não tem desfazer.</p>'
    + '<button class="btn wide danger" data-a="wipe">Apagar todos os dados</button></div>';

  return moedor + backup + neste + risco;
}
function renderSettings(){ const b=$("#dwbody"); if(b) b.innerHTML = viewSettings(); }
function openSettings(){
  S.settingsOpen = true; renderSettings();
  const d=$("#drawer"); d.classList.add("open"); d.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  const c=$("#dwClose"); if(c) c.focus();
}
function closeSettings(){
  S.settingsOpen = false;
  const d=$("#drawer"); d.classList.remove("open"); d.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  const g=$("#gearBtn"); if(g) g.focus();
}

/* ------------------------------------------------------------- render */
function render(toTop){
  $("#cnt").textContent = S.brews.length;
  $("#app").innerHTML = S.tab==="brew" ? viewBrew() : S.tab==="beans" ? viewBeans() : viewHistory();
  $("#tabs").innerHTML = '<div class="inner">'
    + [["brew","Preparar"],["beans","Cafés"],["history","Histórico"]]
      .map(([id,l])=>'<button data-a="tab:'+id+'" class="'+(S.tab===id?"on":"")+'">'+l+'</button>').join("")
    + '</div>';
  if(S.settingsOpen) renderSettings();
  if(toTop) window.scrollTo({top:0});
}

function applySuggestion(){
  const bean = S.beans.find(b=>b.id===S.beanId);
  if(!bean) return;
  const s = suggest(bean, S.methodId);
  S.clicks=s.clicks; S.output=s.output; S.dose=s.dose; S.ratio=s.ratio;
  S.seconds=0; stopTimer(); S.logging=false; S.rating=0; S.tags=[]; S.note="";
}

function refreshDial(){
  const m=METHODS[S.methodId];
  const bean=S.beans.find(b=>b.id===S.beanId);
  $("#dial").innerHTML = dialSVG(S.clicks, m.acc, [m.min,m.max]);
  $("#turns").textContent = turns(S.clicks);
  const off = S.clicks - (bean ? suggest(bean,S.methodId).clicks : S.clicks);
  $("#offLab").textContent = off ? ((off>0?"+"+off:off)+" do sugerido") : "";
}

/* -------------------------------------------------------------- timer */
function startTimer(){
  S.running=true; S.t0=Date.now()-S.seconds*1000;
  S.tick=setInterval(()=>{
    S.seconds=(Date.now()-S.t0)/1000;
    const c=$("#clock"); if(c){
      c.textContent=mmss(S.seconds);
      const m=METHODS[S.methodId];
      c.style.color = (S.seconds>=m.target[0] && S.seconds<=m.target[1]) ? m.acc : "var(--text)";
    }
    const st=$("#stages"); if(st) st.innerHTML=stagesHTML();
  },250);
}
function stopTimer(){ S.running=false; if(S.tick){ clearInterval(S.tick); S.tick=null; } }

/* ------------------------------------------------------------- ações */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const [act,arg] = el.getAttribute("data-a").split(":");

  if(act==="tab"){ stopTimer(); S.tab=arg; render(true); return; }

  if(act==="method"){ S.methodId=arg; applySuggestion(); render(true); return; }

  if(act==="clicks"){ S.clicks=clamp(S.clicks+Number(arg),0,DIAL_MAX); refreshDial(); return; }

  if(act==="timer"){ S.running ? stopTimer() : startTimer(); render(); return; }
  if(act==="reset"){ stopTimer(); S.seconds=0; render(); return; }
  if(act==="log"){ stopTimer(); S.logging=!S.logging; render(); return; }

  if(act==="rate"){
    S.rating=Number(arg);
    const m=METHODS[S.methodId];
    document.querySelectorAll("#rate button").forEach(b=>{
      const on = Number(b.dataset.n)<=S.rating;
      b.setAttribute("style", on ? "background:"+m.acc+";border-color:"+m.acc+";color:var(--ink)" : "");
    });
    const sb=$("#saveBtn"); if(sb){ sb.disabled=false; sb.textContent="Registrar extração"; }
    return;
  }
  if(act==="tag"){
    const i=S.tags.indexOf(arg); i>=0 ? S.tags.splice(i,1) : S.tags.push(arg);
    const on=i<0, c=el.dataset.c;
    el.setAttribute("style", on ? "background:"+c+";border-color:"+c+";color:var(--ink)" : "");
    return;
  }
  if(act==="save"){
    if(!S.rating) return;
    const nt=$("#fNote"); if(nt) S.note=nt.value;
    S.brews.unshift({
      id:uid(), beanId:S.beanId, method:S.methodId, clicks:S.clicks,
      outputG:num(S.output), doseG:num(S.dose), ratio:num(S.ratio),
      timeS:Math.round(S.seconds), rating:S.rating, tags:S.tags.slice(),
      note:S.note, date:new Date().toISOString()
    });
    save(); applySuggestion(); render(true);
    flash("Extração registrada. A próxima sugestão já considera essa nota.");
    return;
  }

  if(act==="roast"){ S.form.roast=arg; render(); return; }
  if(act==="beanOpen"){ S.form.open=true; render(); return; }
  if(act==="beanCancel"){ S.form=emptyForm(); render(); return; }
  if(act==="photoPick"){ const i=$("#nPhoto"); if(i) i.click(); return; }
  if(act==="photoDrop"){ S.form.photo=""; render(); return; }
  if(act==="beanPhoto"){ S.photoTarget=arg; const i=$("#beanPhotoIn"); if(i) i.click(); return; }
  if(act==="beanSave"){
    const f=S.form;
    if(!f.brand.trim()){ flash("Informe pelo menos a marca do café."); return; }
    const b={id:uid(), brand:f.brand.trim(), name:f.name.trim(), roast:f.roast,
             process:f.process.trim(), roastDate:f.roastDate, photo:safePhoto(f.photo),
             createdAt:new Date().toISOString()};
    const prevId = S.beanId;
    S.beans.unshift(b); S.beanId=b.id;
    if(!save()){
      S.beans.shift(); S.beanId=prevId;
      flash("Não coube no espaço deste navegador. Tente salvar sem a foto, ou apague algum café antigo.");
      render(); return;
    }
    S.form = emptyForm();
    applySuggestion(); render();
    return;
  }
  if(act==="beanDel"){
    const b=S.beans.find(x=>x.id===arg);
    if(!confirm("Remover "+beanLabel(b)+" e todas as extrações desse café?")) return;
    S.beans=S.beans.filter(x=>x.id!==arg);
    S.brews=S.brews.filter(x=>x.beanId!==arg);
    if(S.beanId===arg) S.beanId = S.beans[0] ? S.beans[0].id : null;
    save(); applySuggestion(); render();
    return;
  }

  if(act==="fmethod"){ S.fMethod=arg; render(); return; }

  if(act==="setOpen"){ openSettings(); return; }
  if(act==="setClose"){ closeSettings(); return; }
  if(act==="cpt"){
    S.settings.cpt = clamp(S.settings.cpt + Number(arg), CPT_MIN, CPT_MAX);
    save(); render();   // o mostrador e o texto em voltas dependem do CPT
    return;
  }
  if(act==="wipe"){
    if(!confirm("Apagar todos os cafés e extrações deste aparelho? Não tem desfazer — exporte um backup antes se quiser guardar.")) return;
    S.beans=[]; S.brews=[]; S.beanId=null;
    S.form=Object.assign(emptyForm(), {open:true});
    S.fMethod="todos"; S.fBean="todos"; S.tab="brew";
    stopTimer(); S.seconds=0; S.logging=false; S.rating=0; S.tags=[]; S.note="";
    save(); closeSettings(); render(true);
    flash("Dados apagados.");
    return;
  }

  if(act==="export"){
    const blob=new Blob([JSON.stringify({beans:S.beans,brews:S.brews,settings:S.settings},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="meu-cafe-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    return;
  }
  if(act==="import"){ $("#fileIn").click(); return; }
});

document.addEventListener("change", e=>{
  if(e.target.id==="beanSel"){ S.beanId=e.target.value; applySuggestion(); render(true); }
  if(e.target.id==="fBeanSel"){ S.fBean=e.target.value; render(); }

  /* limpar o value deixa escolher a mesma foto de novo depois */
  if(e.target.id==="nPhoto" && e.target.files[0]){
    const file=e.target.files[0]; e.target.value="";
    shrinkImage(file)
      .then(d=>{ S.form.photo=d; render(); })
      .catch(()=>flash("Não consegui ler essa imagem. Tente outra foto."));
  }
  if(e.target.id==="beanPhotoIn" && e.target.files[0]){
    const file=e.target.files[0], id=S.photoTarget; e.target.value=""; S.photoTarget=null;
    shrinkImage(file).then(d=>{
      const b=S.beans.find(x=>x.id===id); if(!b) return;
      const prev=b.photo; b.photo=d;
      if(!save()){
        b.photo=prev;
        flash("Não coube no espaço deste navegador. Remova alguma foto antiga e tente de novo.");
      }
      render();
    }).catch(()=>flash("Não consegui ler essa imagem. Tente outra foto."));
  }
  if(e.target.id==="fileIn" && e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.beans)||!Array.isArray(d.brews)) throw 0;
        const ids=new Set(S.beans.map(b=>b.id));
        d.beans.forEach(b=>{ if(!ids.has(b.id)){ b.photo=safePhoto(b.photo); S.beans.push(b); } });
        const bids=new Set(S.brews.map(b=>b.id));
        d.brews.forEach(b=>{ if(!bids.has(b.id)) S.brews.push(b); });
        applySettings(d.settings);
        /* importar num aparelho vazio precisa escolher um café, senão a aba
           Preparar fica sem nada selecionado */
        if(!S.beanId && S.beans.length){ S.beanId=S.beans[0].id; applySuggestion(); }
        if(S.beans.length) S.form.open=false;
        save(); render(); flash("Backup importado.");
      }catch(err){ flash("Arquivo inválido."); }
    };
    r.readAsText(e.target.files[0]);
  }
});

document.addEventListener("input", e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="fOut"){
    S.output=v;
    const o=num(v), r=num(S.ratio);
    if(o>0&&r>0){ S.dose=r1(o/r); const d=$("#fDose"); if(d) d.value=S.dose; }
    const st=$("#stages"); if(st) st.innerHTML=stagesHTML();
  }
  else if(id==="fDose"){
    S.dose=v;
    const o=num(S.output), d=num(v);
    if(o>0&&d>0){ S.ratio=r1(o/d); const r=$("#fRatio"); if(r) r.value=S.ratio; }
    const st=$("#stages"); if(st) st.innerHTML=stagesHTML();
  }
  else if(id==="fRatio"){
    S.ratio=v;
    const o=num(S.output), r=num(v);
    if(o>0&&r>0){ S.dose=r1(o/r); const d=$("#fDose"); if(d) d.value=S.dose; }
  }
  else if(id==="fNote") S.note=v;
  else if(id==="nBrand") S.form.brand=v;
  else if(id==="nName") S.form.name=v;
  else if(id==="nProc") S.form.process=v;
  else if(id==="nDate") S.form.roastDate=v;
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && S.settingsOpen) closeSettings();
});

/* --------------------------------------------------------------- boot */
load();
if(S.beans.length) applySuggestion();
render(true);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
